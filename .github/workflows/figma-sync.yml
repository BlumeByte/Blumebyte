# ─────────────────────────────────────────────────────────────────────────────
# Figma Asset Sync
#
# Pulls exported images from the Figma REST API and commits any changes to
# src/assets/ so that Vite's figma:asset/ resolver always has up-to-date files.
#
# Required GitHub repository secrets:
#   FIGMA_TOKEN    — Figma personal access token
#                    (Figma → Account settings → Personal access tokens)
#
# Required GitHub repository variables  (Settings → Variables → Actions):
#   FIGMA_FILE_KEY — alphanumeric ID from the Figma file URL
#                    https://www.figma.com/file/{FIGMA_FILE_KEY}/...
#                    Can also be set directly in figma-assets.json.
#
# The list of nodes to export lives in  figma-assets.json  at the repo root.
# ─────────────────────────────────────────────────────────────────────────────

name: Figma Asset Sync

on:
  # Run on every push to main/master (designers merge Figma → Git)
  push:
    branches:
      - main
      - master
    # Only re-run if the config itself changes, or on demand
    paths:
      - figma-assets.json
      - .github/workflows/figma-sync.yml

  # Allow manual trigger from the Actions tab (useful for initial setup)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — download images but do NOT commit"
        required: false
        default: "false"
        type: boolean

# Prevent concurrent runs that could create conflicting commits
concurrency:
  group: figma-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Pull Figma exports → src/assets
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit updated assets back

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Full history so we can commit back cleanly
          fetch-depth: 0

      # ── 2. Validate secrets ───────────────────────────────────────────────
      - name: Validate FIGMA_TOKEN secret
        run: |
          if [ -z "${{ secrets.FIGMA_TOKEN }}" ]; then
            echo "::error::FIGMA_TOKEN secret is not set."
            echo "::error::Go to Settings → Secrets → Actions and add FIGMA_TOKEN."
            exit 1
          fi
          echo "✅  FIGMA_TOKEN is present."

      # ── 3. Read config ────────────────────────────────────────────────────
      - name: Read figma-assets.json
        id: config
        run: |
          if [ ! -f figma-assets.json ]; then
            echo "::error::figma-assets.json not found in repo root."
            exit 1
          fi

          # Prefer env variable override, then JSON field
          FILE_KEY="${{ vars.FIGMA_FILE_KEY }}"
          if [ -z "$FILE_KEY" ]; then
            FILE_KEY=$(jq -r '.file_key // empty' figma-assets.json)
          fi
          if [ -z "$FILE_KEY" ] || [ "$FILE_KEY" = "REPLACE_WITH_YOUR_FIGMA_FILE_KEY" ]; then
            echo "::error::Figma file key is not configured."
            echo "::error::Set it in figma-assets.json (.file_key) or as a repository variable FIGMA_FILE_KEY."
            exit 1
          fi

          echo "file_key=$FILE_KEY" >> "$GITHUB_OUTPUT"
          echo "node_count=$(jq '.nodes | length' figma-assets.json)" >> "$GITHUB_OUTPUT"
          echo "📄  File key: $FILE_KEY"
          echo "📦  Nodes to export: $(jq '.nodes | length' figma-assets.json)"

      # ── 4. Set up Python (for hashing + JSON manipulation) ───────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 5. Pull assets from Figma REST API ───────────────────────────────
      - name: Sync assets
        id: sync
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ steps.config.outputs.file_key }}
        run: |
          python3 - << 'PYEOF'
          import json, hashlib, os, sys, urllib.request, urllib.error

          TOKEN    = os.environ["FIGMA_TOKEN"]
          FILE_KEY = os.environ["FIGMA_FILE_KEY"]
          ASSETS_DIR = "src/assets"
          CONFIG_PATH = "figma-assets.json"
          FIGMA_API = "https://api.figma.com/v1"

          def figma_get(path):
              req = urllib.request.Request(
                  f"{FIGMA_API}{path}",
                  headers={"X-Figma-Token": TOKEN},
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read())
              except urllib.error.HTTPError as e:
                  body = e.read().decode()
                  print(f"::error::Figma API error {e.code} for {path}: {body}")
                  sys.exit(1)

          def download(url):
              req = urllib.request.Request(url)
              with urllib.request.urlopen(req) as resp:
                  return resp.read()

          def sha1(data):
              return hashlib.sha1(data).hexdigest()

          os.makedirs(ASSETS_DIR, exist_ok=True)

          with open(CONFIG_PATH) as f:
              config = json.load(f)

          nodes = config.get("nodes", [])
          if not nodes:
              print("::warning::No nodes defined in figma-assets.json — nothing to do.")
              sys.exit(0)

          # ── Group nodes by format so we make as few API calls as possible ──
          from collections import defaultdict
          by_format = defaultdict(list)
          for n in nodes:
              fmt = (n.get("format", "PNG").upper(), int(n.get("scale", 2)))
              by_format[fmt].append(n)

          changed = []
          errors  = []

          for (fmt, scale), group in by_format.items():
              ids = ",".join(n["id"] for n in group)
              print(f"\n🔍  Requesting {fmt} @{scale}x exports for {len(group)} node(s)...")
              resp = figma_get(
                  f"/images/{FILE_KEY}"
                  f"?ids={ids}&format={fmt.lower()}&scale={scale}"
              )
              if resp.get("err"):
                  print(f"::error::Figma export error: {resp['err']}")
                  sys.exit(1)

              images = resp.get("images", {})

              for node in group:
                  node_id = node["id"]
                  ext = fmt.lower()
                  url = images.get(node_id)

                  if not url:
                      msg = f"No export URL returned for node '{node_id}' ({node.get('name', '?')})"
                      print(f"::warning::{msg}")
                      errors.append(msg)
                      continue

                  print(f"  ⬇  Downloading '{node.get('name', node_id)}' ...")
                  try:
                      data = download(url)
                  except Exception as e:
                      msg = f"Failed to download {node_id}: {e}"
                      print(f"::error::{msg}")
                      errors.append(msg)
                      continue

                  digest = sha1(data)
                  filename = f"{digest}.{ext}"
                  dest = os.path.join(ASSETS_DIR, filename)

                  old_hash = node.get("hash", "")
                  node["hash"] = digest

                  if os.path.exists(dest):
                      print(f"  ✅  {filename} — unchanged")
                  else:
                      with open(dest, "wb") as fh:
                          fh.write(data)
                      if old_hash and old_hash != digest:
                          print(f"  🔄  {filename} — updated (was {old_hash[:12]}…)")
                      else:
                          print(f"  🆕  {filename} — new file")
                      changed.append(filename)

          # Write updated config with new hashes
          with open(CONFIG_PATH, "w") as f:
              json.dump(config, f, indent=2)
              f.write("\n")

          if errors:
              print(f"\n⚠️  {len(errors)} error(s) encountered:")
              for e in errors:
                  print(f"   • {e}")

          print(f"\n📊  Summary: {len(changed)} file(s) added/updated, {len(errors)} error(s).")

          # Write outputs for next step
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write(f"changed_count={len(changed)}\n")
              gh.write(f"error_count={len(errors)}\n")
              gh.write(f"changed_files={','.join(changed)}\n")
          PYEOF

      # ── 6. Fail if any export errors occurred ─────────────────────────────
      - name: Check for export errors
        if: steps.sync.outputs.error_count != '0'
        run: |
          echo "::error::${{ steps.sync.outputs.error_count }} Figma export(s) failed. See logs above."
          exit 1

      # ── 7. Commit updated assets ──────────────────────────────────────────
      - name: Commit updated assets
        if: |
          steps.sync.outputs.changed_count != '0' &&
          github.event.inputs.dry_run != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add src/assets/ figma-assets.json

          CHANGED="${{ steps.sync.outputs.changed_files }}"
          COUNT="${{ steps.sync.outputs.changed_count }}"

          git commit -m "chore(assets): sync ${COUNT} Figma export(s) [skip ci]

          Updated files:
          $(echo "$CHANGED" | tr ',' '\n' | sed 's/^/  - /')

          Triggered by: ${{ github.event_name }} on ${{ github.ref_name }}"

          git push origin HEAD

      # ── 8. Summary ────────────────────────────────────────────────────────
      - name: Job summary
        if: always()
        run: |
          echo "## Figma Sync Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ steps.sync.outputs.changed_count }}" = "0" ]; then
            echo "✅ All assets are already up to date — no changes committed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🔄 **${{ steps.sync.outputs.changed_count }}** asset(s) updated:" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "${{ steps.sync.outputs.changed_files }}" | tr ',' '\n' | \
              sed 's/^/- \`src\/assets\//' | sed 's/$/\`/' >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ steps.sync.outputs.error_count }}" != "0" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ **${{ steps.sync.outputs.error_count }}** export error(s) — see logs for details." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ℹ️ **Dry run** — files were downloaded but NOT committed." >> "$GITHUB_STEP_SUMMARY"
          fi
