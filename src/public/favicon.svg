<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Black background -->
  <rect width="64" height="64" fill="black"/>

  <!-- Left vertical stem of B -->
  <rect x="7" y="6" width="10" height="52" rx="2" fill="white"/>

  <!-- Top bowl: large leaf shape filling the upper B bowl -->
  <!-- Outer leaf/bowl: starts at stem top, sweeps right to ~x=54 at midpoint, returns to stem at y=33 -->
  <path d="M17 6 C17 6 44 6 54 18 C60 26 54 33 17 33 Z" fill="white"/>
  <!-- Two curved black vein lines on the leaf -->
  <path d="M24 12 C34 16 44 20 52 26" stroke="black" stroke-width="1.8" stroke-linecap="round" fill="none"/>
  <path d="M22 20 C31 24 40 27 50 30" stroke="black" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- Bottom bowl: solid white arch with black inner cutout -->
  <!-- Outer arch -->
  <path d="M17 33 H40 C52 33 58 40 58 47 C58 54 52 58 40 58 H17 Z" fill="white"/>
  <!-- Inner black cutout to make it hollow like a bowl -->
  <path d="M17 39 H38 C47 39 51 43 51 47 C51 51 47 53 38 53 H17 Z" fill="black"/>
</svg>
