# Blumebyte HR Management - Supabase Configuration
# Project: ivohczdtuxasyfoiphqu
# NOTE: Edge functions are deployed separately via Supabase CLI, NOT through Figma Make

project_id = "ivohczdtuxasyfoiphqu"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true
ip_version = "IPv4"

[studio]
enabled = true
port = 54324
api_url = "http://localhost"

[inbucket]
enabled = true
port = 54325
smtp_port = 54326
pop3_port = 54327

[storage]
enabled = true
file_size_limit = "50MB"

[auth]
enabled = true
site_url = "https://blumebyte.vercel.app"
additional_redirect_urls = [
  "http://localhost:5173",
  "http://localhost:5173/auth/callback",
  "https://blumebyte.vercel.app/auth/callback"
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.external.google]
enabled = false

# Edge Functions
[functions.make-server-a35148f0]
verify_jwt = false

[functions.server]
verify_jwt = false

# Analytics
[analytics]
enabled = false
